version: '3.8'

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: enterprise_ai_n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - MONITOR_URL=http://backend:8000/api/ai/workflow-monitor/workflows
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
